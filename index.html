<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turnos para WhatsApp">
  <title>Turnos</title>
  <link rel="stylesheet" href="iconos/bootstrap-icons.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <div class="encabezado">
      <h1>Turnos</h1>
      <span class="texto-suave" id="contador"></span>
      <button id="btn-panel" type="button"><i class="bi bi-cash-coin"></i> Caja</button>
    </div>

    <!-- Carga rápida: nombre + hora + Enter -->
    <section class="tarjeta">
      <div class="fila">
        <label class="campo-nombre-wrap">Nombre:<input id="nombre" class="campo-nombre" placeholder="Nombre" autocomplete="off"></label>
        <label class="campo-hora-wrap">Hora:<input id="hora" type="time"></label>
        <button id="btn-horarios" class="btn-icono" type="button" aria-label="Ver horarios disponibles" title="Ver horarios disponibles"><i class="bi bi-clock" aria-hidden="true"></i></button>
        <button id="btn-agregar" class="btn-principal btn-icono" type="button" aria-label="Agregar turno" title="Agregar turno">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Opcionales: solo si hacen falta -->
      <details>
        <summary>Otro día o WhatsApp (opcional)</summary>
        <input id="fecha" type="date">
        <input id="telefono" type="tel" placeholder="WhatsApp (ej: 341 555 1234)">
      </details>
    </section>

    <section id="lista"></section>

    <!-- Configuración y respaldo -->
    <details class="tarjeta">
      <summary><i class="bi bi-gear"></i> Recordatorio </summary>

      <input id="negocio" placeholder="Nombre de tu negocio">
      <textarea id="plantilla" rows="3"></textarea>
      <input id="archivo" type="file" accept=".json" hidden>
    </details>

  </main>
  <dialog id="modal-horarios">
  <h2>Horarios libres</h2>
  <input id="modal-fecha" type="date">
  <div id="modal-grilla" class="grilla"></div>
  <button id="btn-cerrar-modal" type="button">Cerrar</button>
</dialog>
<dialog id="panel-caja">
  <div class="encabezado">
    <h2>Caja</h2>
    <button id="btn-cerrar-panel" type="button">Cerrar</button>
  </div>

  <div class="fila">
    <select id="panel-modo">
      <option value="dia">Día</option>
      <option value="mes">Mes</option>
    </select>
    <input id="panel-fecha" type="date">
  </div>

  <div id="panel-resumen" class="resumen"></div>
  <div id="panel-lista"></div>

  <div class="fila separado">
    <input id="corte-nombre" placeholder="Cliente (opcional)">
    <input id="corte-precio" type="number" inputmode="numeric" placeholder="Precio">
    <button id="btn-corte" class="btn-principal" type="button"><i class="bi bi-plus-lg"></i></button>
  </div>

  <button id="btn-config" type="button" class="separado">Cambiar precio y %</button>
</dialog>

<dialog id="modal-config">
  <h2>Tus valores</h2>

  <label for="cfg-precio" class="texto-suave">Precio del corte ($)</label>
  <input id="cfg-precio" type="number" inputmode="numeric" placeholder="Ej: 8000">

  <label for="cfg-porcentaje" class="texto-suave">¿Qué % te llevás de cada corte?</label>
  <input id="cfg-porcentaje" type="number" inputmode="numeric" placeholder="Ej: 50">

  <p id="cfg-error" class="error"></p>
  <div class="fila">
    <button id="btn-cancelar-config" type="button">Cancelar</button>
    <button id="btn-guardar-config" class="btn-principal" type="button">Guardar</button>
  </div>
</dialog>
<dialog id="modal-confirmar">
  <p id="confirmar-texto"></p>
  <div class="fila">
    <button id="btn-confirmar-no" type="button">Cancelar</button>
    <button id="btn-confirmar-si" type="button" class="btn-peligro">Borrar</button>
  </div>
</dialog>
  <script src="app.js" defer></script>
</body>
</html>
